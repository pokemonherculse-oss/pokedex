<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex by Generation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ee1515;--dred:#b30d0d;--yel:#ffcb05;--blue:#3b4cca;--ink:#f4f4f8;--bg:#000;--card:#11131f;--mut:#a9aec8;--line:#05050a;--ring:#2c2f4d}
html{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;background:#000 radial-gradient(circle at 1px 1px,#ffffff12 1.5px,transparent 0) 0 0/22px 22px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--red) 0 78%,var(--dred) 78%);border-bottom:5px solid var(--line);padding:10px 20px 14px;box-shadow:0 4px 0 #0003}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lens{width:46px;height:46px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#bfeaff,#2f9bff 45%,#0b4fb3);box-shadow:0 0 0 4px var(--line),inset 0 -4px 6px #0006;flex:none}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i:nth-child(1){background:#ff5a5a}.dots i:nth-child(2){background:var(--yel)}.dots i:nth-child(3){background:#4cd964}
h1{margin:0;font-size:1.7rem;font-weight:700;color:#fff;text-shadow:2px 2px 0 var(--line),-1px -1px 0 var(--line),1px -1px 0 var(--line),-1px 1px 0 var(--line);letter-spacing:.02em}
.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button,select,input{font:inherit;font-weight:500;color:#222;background:#fff;border:3px solid var(--line);border-radius:99px;padding:3px 13px;box-shadow:0 3px 0 var(--line)}
button{cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
button.on{background:var(--yel)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{min-width:170px}
main{padding:6px 20px 60px;max-width:1500px;margin:auto}
h2{display:inline-flex;align-items:center;gap:10px;margin:36px 0 0;font-size:1.3rem;font-weight:700;color:#fff;background:var(--blue);border:4px solid var(--line);border-radius:14px;padding:3px 18px 3px 12px;box-shadow:0 4px 0 var(--line)}
h2:before{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:linear-gradient(var(--red) 0 44%,var(--line) 44% 56%,#fff 56%)}
h2 small{color:var(--yel);font-weight:500;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;margin-top:16px}
.card{--tc:#999;background:var(--card);border:4px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 0 var(--line),0 0 0 2px var(--ring);transition:transform .15s}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
.top{height:185px;display:grid;place-items:center;position:relative;border-bottom:4px solid var(--line);background:radial-gradient(circle at 50% 55%,#fff9 0 30%,transparent 31%),linear-gradient(160deg,var(--c1,#ccd),var(--c2,#eef))}
.top:before{content:"";position:absolute;width:170px;height:170px;right:-40px;bottom:-50px;border-radius:50%;border:12px solid #ffffff55;background:linear-gradient(#fff3 0 44%,#fff5 44% 56%,#fff3 56%)}
.top img{position:relative;max-width:80%;max-height:82%;filter:drop-shadow(0 7px 5px #0004)}
.dex{position:absolute;left:10px;top:9px;font-weight:700;font-size:.8rem;color:#fff;background:var(--line);padding:1px 9px;border-radius:99px;z-index:1}
.body{padding:10px 13px 13px}
.name{font-weight:700;font-size:1.15rem}
.types{display:flex;gap:5px;margin:4px 0 9px;min-height:24px}
.t{font-size:.76rem;font-weight:600;padding:1px 11px;border-radius:99px;color:#fff;text-transform:capitalize;border:2px solid #0005;text-shadow:0 1px 1px #0006}
.s{display:grid;grid-template-columns:32px 1fr 28px;gap:6px;align-items:center;font-size:.78rem;color:var(--mut);margin:3px 0;font-weight:500}
.s i{display:block;height:9px;border-radius:5px;background:#ffffff22;border:2px solid var(--line);overflow:hidden}
.s i b{display:block;height:100%;background-image:linear-gradient(#fff5,#0002)}
.s span:last-child{text-align:right;color:var(--ink);font-weight:700}
.tot{margin-top:7px;padding:3px 10px;border-radius:99px;background:var(--yel);color:#222;border:2px solid var(--line);font-size:.82rem;display:flex;justify-content:space-between;font-weight:700}
.note{color:var(--mut);font-size:.72rem;margin-top:4px}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.rk{position:absolute;right:10px;top:8px;z-index:1;min-width:34px;text-align:center;font-weight:700;font-size:.9rem;color:#222;background:var(--yel);border:3px solid var(--line);border-radius:99px;padding:0 8px}
.hl{background:#ffcb0577;border-radius:8px;outline:2px solid #ffcb05}
.warn,.prog{color:#fff;font-weight:500;font-size:.85rem}.warn{color:var(--ink);background:#ffcb0555;border:3px dashed var(--line);border-radius:12px;padding:6px 12px;margin-top:16px}

/* extra polish */
::selection{background:var(--yel);color:#222}
html{scrollbar-color:var(--red) var(--bg)}
.card{cursor:pointer;position:relative}
.card:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 40%,#fff6 50%,transparent 60%) -150% 0/250% 100% no-repeat;transition:background-position .6s}
.card:hover:before{background-position:150% 0}
.card:hover{box-shadow:0 9px 0 var(--line),0 0 0 3px var(--tc)}
.card:focus-visible{outline:4px solid var(--yel);outline-offset:3px}
.name{display:flex;justify-content:space-between;align-items:center}
.name:after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:linear-gradient(var(--tc) 0 44%,var(--line) 44% 56%,#fff 56%)}
header .bar{padding-bottom:2px}
/* pokeball reveal */
#ov{position:fixed;inset:0;z-index:50;overflow:hidden;background:#0000;transition:background .5s}
#ov.open{background:#000d}
#ov .half{position:fixed;left:0;right:0;height:50vh;z-index:3;transition:transform .5s cubic-bezier(.7,0,.3,1)}
#ov .hf-t{top:0;transform:translateY(-101%);background:radial-gradient(circle at 28% 22%,#ff8a8a,var(--red) 50%,var(--dred));border-bottom:12px solid #111}
#ov .hf-b{bottom:0;transform:translateY(101%);background:radial-gradient(circle at 70% 80%,#d8d8e0,#f6f6f8 55%);border-top:12px solid #111}
#ov.shut .half{transform:none}
#ov.open .half{transition-duration:.85s;transition-timing-function:cubic-bezier(.75,0,.2,1)}
#ov.open .hf-t{transform:translateY(-101%)}#ov.open .hf-b{transform:translateY(101%)}
#ov .pbtn,#ov .half{pointer-events:none}
#ov .pbtn{position:fixed;left:50%;top:50%;width:min(24vw,130px);height:min(24vw,130px);margin:calc(min(24vw,130px)/-2) 0 0 calc(min(24vw,130px)/-2);border-radius:50%;background:radial-gradient(#fff 0 42%,#e5e5ea 44%);border:12px solid #111;z-index:4;box-shadow:0 0 0 6px #fff8;transform:scale(0);opacity:0;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s}
#ov.shut .pbtn{transform:scale(1);opacity:1;transition-delay:.3s}
#ov.shut:not(.open):not(.closing) .pbtn{animation:wob .8s .75s}
#ov.open .pbtn{transform:scale(9);opacity:0;transition:transform .55s ease-in,opacity .45s;transition-delay:0s}
@keyframes wob{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}35%{transform:rotate(14deg)}55%{transform:rotate(-10deg)}75%{transform:rotate(6deg)}}
#ov .flash{position:fixed;inset:0;z-index:5;background:radial-gradient(circle,#fff 0 30%,#fffd 60%,transparent 100%);opacity:0;pointer-events:none}
#ov.open .flash{animation:fl .8s ease-out}
@keyframes fl{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#ov .detail{position:absolute;inset:0;z-index:1;display:grid;overflow:auto;padding:20px;perspective:1400px;opacity:0;pointer-events:none;transition:opacity .3s}
#ov.open .detail{opacity:1;pointer-events:auto;transition:opacity .25s .2s}
#ov.open .panel{animation:cardOut .95s .2s both cubic-bezier(.2,1.1,.3,1)}
#ov.open .panel.flip{animation:cardFlip .35s both ease-out}
@keyframes cardOut{0%{transform:scale(.05) rotateY(-100deg) translateY(50px);opacity:0;filter:brightness(3)}40%{opacity:1}70%{transform:scale(1.04) rotateY(8deg);filter:brightness(1.2)}100%{transform:none;opacity:1;filter:none}}
@keyframes cardFlip{from{transform:rotateY(calc(var(--d,1)*-70deg)) translateX(calc(var(--d,1)*40px));opacity:.2}to{transform:none;opacity:1}}
.panel{margin:auto;width:min(920px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--card);border:5px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line),0 0 0 3px var(--ring);overflow:hidden}
@media(max-width:700px){.panel{grid-template-columns:1fr}}
.pic{position:relative;min-height:320px;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,#fffa 0 32%,transparent 33%),linear-gradient(160deg,var(--c1),var(--c2));border-right:5px solid var(--line)}
@media(max-width:700px){.pic{border-right:0;border-bottom:5px solid var(--line)}}
.pic:before{content:"";position:absolute;width:300px;height:300px;left:-90px;bottom:-110px;border-radius:50%;border:18px solid #ffffff55;background:linear-gradient(#fff3 0 44%,#fff5 44% 56%,#fff3 56%)}
.pic img{position:relative;width:min(80%,340px);max-height:300px;object-fit:contain;filter:drop-shadow(0 12px 8px #0005);animation:flt 3s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px)}}
.info{padding:20px 22px}
.info h3{margin:0;font-size:1.9rem;line-height:1.1}
.info .sub{color:var(--mut);font-weight:500;margin:2px 0 8px}
.ds{display:grid;grid-template-columns:42px 1fr 36px;gap:8px;align-items:center;margin:7px 0;font-weight:600}
.ds i{display:block;height:15px;border-radius:8px;background:#ffffff22;border:3px solid var(--line);overflow:hidden}
.ds i b{display:block;height:100%;width:0;background-image:linear-gradient(#fff5,#0002)}
#ov.show .ds i b{width:var(--w);transition:width .9s calc(.55s + var(--i,0)*.1s) cubic-bezier(.2,.9,.3,1)}
.rise{opacity:0;transform:translateY(16px)}
#ov.show .rise{opacity:1;transform:none;transition:opacity .5s calc(.3s + var(--i,0)*.1s),transform .6s calc(.3s + var(--i,0)*.1s) cubic-bezier(.2,1.2,.4,1)}
#ov .pic img{animation:none;opacity:0}
#ov.show .pic img{opacity:1;animation:imgIn .9s .25s both cubic-bezier(.2,1.3,.4,1),flt 3s 1.3s ease-in-out infinite}
@keyframes imgIn{0%{transform:scale(.2) translateY(60px) rotate(-12deg);filter:brightness(4) drop-shadow(0 0 20px #fff)}60%{transform:scale(1.1) rotate(3deg)}100%{transform:none;filter:drop-shadow(0 12px 8px #0005)}}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.fc{display:flex;flex-direction:column;font-weight:700;font-size:.95rem;padding:3px 12px;border:3px solid var(--line);border-radius:12px;background:#ffffff0d;box-shadow:0 0 0 1px var(--ring)}
.fc small{font-weight:500;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--yel)}
.dexent{font-size:.86rem;color:var(--mut);margin:0 0 10px;line-height:1.38;font-style:italic}
.ds span:last-child{text-align:right}
.nav{display:flex;gap:8px;margin-top:14px}
.nav button{flex:1}
.x{position:fixed;right:16px;top:14px;z-index:6;width:46px;height:46px;padding:0;border-radius:50%;font-size:1.3rem;font-weight:700;background:var(--yel);opacity:0;transition:opacity .4s .6s}
#ov.open .x{opacity:1}
/* abilities */
.abs{margin-top:14px}
.abh{font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--yel)}
.ab{margin-top:7px;padding:7px 12px;border:3px solid var(--line);border-radius:12px;background:#ffffff0d;box-shadow:0 0 0 1px var(--ring)}
.ab b{font-weight:700}
.ab em{font-style:normal;font-size:.68rem;font-weight:700;color:#222;background:var(--yel);border-radius:99px;padding:0 8px;margin-left:8px;vertical-align:middle}
.ab p{margin:3px 0 0;font-size:.82rem;color:var(--mut);font-weight:400;line-height:1.3}
.abl{font-size:.74rem;color:var(--mut);margin:-3px 0 8px;font-weight:500;min-height:1em}
.abl i{color:var(--yel)}
@media(prefers-reduced-motion:reduce){#ov .half,#ov .detail,#ov .pbtn,.ds i b,.pic img,#ov .panel{transition:none!important;animation:none!important}#ov .flash{display:none}}
</style></head>

const REG={26:'alola',38:'alola',53:'alola',59:'hisui',80:'galar',199:'galar',128:'paldea',157:'hisui',503:'hisui',571:'hisui',618:'galar',706:'hisui',713:'hisui',724:'hisui'};

.panel.foil:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;
  background:linear-gradient(115deg,transparent 30%,#ff6ec455,#ffe66e55,#6effd855,#6ea8ff55,transparent 70%);transform:translateX(-100%)}
#ov.show .panel.foil:after{animation:foil 1.6s 1.2s ease-in-out}
@keyframes foil{0%{transform:translateX(-100%);opacity:1}100%{transform:translateX(100%);opacity:1}}
.shock{position:fixed;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;z-index:2;pointer-events:none;
  border:6px solid var(--sc,#fff);opacity:0;animation:shock .9s ease-out both}
.shock.b{animation-delay:.12s;border-width:3px}
@keyframes shock{0%{transform:scale(.2);opacity:.9}100%{transform:scale(9);opacity:0}}

/* ---------- boot screen (CSS only, ~1.2s) ---------- */
#boot{position:fixed;inset:0;z-index:300;background:#000;display:grid;place-items:center;clip-path:inset(0);
  transition:clip-path .6s cubic-bezier(.7,0,.2,1),opacity .6s}
#boot.out{clip-path:inset(50% 0 50% 0);opacity:0}
#boot .bl{display:flex;flex-direction:column;align-items:center;gap:18px;color:#fff;font-weight:700;letter-spacing:.2em}
#boot .lens{width:84px;height:84px;border-width:6px;animation:bootPop .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bootPop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
#boot .pb{width:220px;height:8px;border:2px solid #fff;border-radius:9px;overflow:hidden}
#boot .pb i{display:block;height:100%;background:var(--yel);transform-origin:left;animation:pbar 1s .2s both ease-in-out}
@keyframes pbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#boot .bt{opacity:0;animation:fadeUp .5s .1s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){.pre{opacity:1}.pop,.top img.ld,.shock,#boot *,#ov.show .pic:after,#ov.show .ds i b:after,#ov.show .panel.foil:after,#ov.show .info .types .t{animation:none!important}.card:hover{transform:none}}
</style>
<script>
(()=>{
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const main=document.getElementById('main');

/* ----- detail view: shockwave, glow colour, foil, mouse parallax ----- */
function scan(){
  const o=document.getElementById('ov');if(!o||!o.classList.contains('show'))return;
  const p=o.querySelector('.panel');if(!p||p.dataset.fx)return;p.dataset.fx=1;
  const tc=o.querySelector('.panel .t');
  const col=tc?getComputedStyle(tc).backgroundColor:'#fff';
  p.classList.toggle('foil',+p.dataset.bst>=600);
  o.style.setProperty('--gl',col);
  if(calm)return;
  o.querySelectorAll('.shock').forEach(s=>s.remove());
  ['a','b'].forEach(k=>{const s=document.createElement('div');s.className='shock '+k;s.style.setProperty('--sc',col);
    s.addEventListener('animationend',()=>s.remove());o.append(s)});
}
let raf=0;const sched=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;scan()})};
new MutationObserver(()=>{
  const o=document.getElementById('ov');if(!o||o._fx)return;o._fx=1;
  new MutationObserver(sched).observe(o,{attributes:true,attributeFilter:['class']});
  new MutationObserver(sched).observe(o.querySelector('.detail'),{childList:true});
  let pr=0,lx=0,ly=0;
  o.addEventListener('pointermove',e=>{lx=e.clientX;ly=e.clientY;if(pr)return;
    pr=requestAnimationFrame(()=>{pr=0;const pic=o.querySelector('.pic');if(!pic)return;
      pic.style.setProperty('--px',((lx/innerWidth-.5)*-22).toFixed(1)+'px');
      pic.style.setProperty('--py',((ly/innerHeight-.5)*-22).toFixed(1)+'px')})});
  sched();
}).observe(document.body,{childList:true});

/* ----- grid: entrance, sprite pop, tilt ----- */
if(!calm){
  const rio=new IntersectionObserver(es=>{let i=0;es.forEach(x=>{
    if(!x.isIntersecting)return;rio.unobserve(x.target);const el=x.target;
    el.style.setProperty('--dl',Math.min(i++*30,240)+'ms');el.classList.replace('pre','pop');
    el.addEventListener('animationend',ev=>{if(ev.target===el)el.classList.remove('pop')});
  })},{threshold:.03});
  const prep=()=>main.querySelectorAll('.card:not([data-rv]),h2:not([data-rv])').forEach(el=>{el.dataset.rv=1;el.classList.add('pre');rio.observe(el)});
  new MutationObserver(prep).observe(main,{childList:true});prep();
}
main.addEventListener('load',e=>{const i=e.target;if(i.tagName==='IMG'){i.classList.remove('ld');void i.offsetWidth;i.classList.add('ld')}},true);
if(matchMedia('(hover:hover)').matches&&!calm){
  let c=null,x=0,y=0,t=0;
  main.addEventListener('pointermove',e=>{
    c=e.target.closest&&e.target.closest('.card');if(!c)return;x=e.clientX;y=e.clientY;if(t)return;
    t=requestAnimationFrame(()=>{t=0;if(!c)return;const r=c.getBoundingClientRect(),u=(x-r.left)/r.width,v=(y-r.top)/r.height;
      c.style.setProperty('--rx',((.5-v)*12).toFixed(1)+'deg');c.style.setProperty('--ry',((u-.5)*12).toFixed(1)+'deg');
      c.style.setProperty('--mx',(u*100).toFixed(0)+'%');c.style.setProperty('--my',(v*100).toFixed(0)+'%')});
  });
  main.addEventListener('pointerout',e=>{
    const k=e.target.closest&&e.target.closest('.card');
    if(k&&!k.contains(e.relatedTarget)){k.style.setProperty('--rx','0deg');k.style.setProperty('--ry','0deg')}
  });
}

/* ----- quick boot screen (once per session, click to skip) ----- */
if(!calm&&!sessionStorage.getItem('boot')){
  sessionStorage.setItem('boot',1);
  const b=document.createElement('div');b.id='boot';
  b.innerHTML='<div class="bl"><span class="lens"></span><div class="bt">POKÉDEX</div><div class="pb"><i></i></div></div>';
  document.body.append(b);
  const end=()=>{if(b.classList.contains('out'))return;b.classList.add('out');setTimeout(()=>b.remove(),700)};
  b.onclick=end;setTimeout(end,1300);
}
})();
</script>
<style id="dx">
/* ===== game-style detail screen ===== */
.panel.dx{display:block;width:min(1180px,100%);border-radius:26px}
#ov.open .panel{animation:dxIn .75s .15s both cubic-bezier(.2,1,.3,1)}
#ov.open .panel.flip{animation:cardFlip .35s both ease-out}
@keyframes dxIn{from{opacity:0;transform:translateY(50px) scale(.9) rotateX(10deg)}to{opacity:1;transform:none}}
.dx .stage{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr) minmax(0,330px);gap:16px;padding:20px 20px 10px;align-items:start}
@media(max-width:980px){.dx .stage{grid-template-columns:1fr}.dx .mid{order:-1}}
.dx .gl{background:#1b1a4ad9;border:3px solid #ffffff26;border-radius:16px;box-shadow:0 0 0 2px var(--line);overflow:hidden}
.dx .rs{display:grid;gap:14px}
.dx .gh{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:linear-gradient(#ffffff2a,#ffffff0d);font-weight:700;font-size:.92rem;letter-spacing:.04em}
.dx .gb{padding:8px 10px 10px}
.dx .lvs{display:flex;gap:5px}
.dx .lvs button,.dx .pr button{padding:0 11px;font-size:.78rem;box-shadow:0 2px 0 var(--line);border-width:2px}
/* stat rows */
.dx .sr{display:grid;grid-template-columns:34px 1fr 62px 30px;gap:1px 8px;align-items:center;padding:5px 12px 3px;font-weight:600;font-size:.93rem}
.dx .sr .sl{color:#e8ebff}
.dx .sr .bw{position:relative;height:12px;border-radius:7px;background:#0007;overflow:hidden;border:2px solid var(--line)}
.dx .sr .bw i{position:absolute;left:0;top:0;bottom:0;display:block;transform:scaleX(0);transform-origin:left;transition:width .3s cubic-bezier(.2,.9,.3,1)}
.dx .sr .g{width:calc(var(--g)*1%);background:linear-gradient(#fff7,#0002),var(--yel)}
.dx .sr .b{width:calc(var(--b)*1%);background:linear-gradient(#fff5,#0002),var(--c)}
#ov.show .dx .sr .bw i{animation:barIn .8s calc(.45s + var(--i,0)*.08s) both cubic-bezier(.2,.9,.3,1)}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dx .sv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.dx .dl,.dx .td{display:block;font-size:.68rem;color:#6dff9a;font-weight:700;height:.8em;line-height:.8em;margin-top:-1px}
.dx .evn{text-align:right;font-weight:700;color:var(--yel);font-variant-numeric:tabular-nums}
.dx .sr.mx .evn{color:#6dff9a}
.dx .tr{border-top:2px solid #ffffff1f;margin-top:4px;padding-top:7px;padding-bottom:7px}
.dx .tr .td{display:inline-block;margin-left:5px}
/* sliders */
.dx input[type=range]{grid-column:1/-1;-webkit-appearance:none;appearance:none;width:100%;min-width:0;height:18px;margin:0;padding:0;border:0;background:none;box-shadow:none;border-radius:0;cursor:pointer;--p:0%}
.dx input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--yel) var(--p),#ffffff26 var(--p))}
.dx input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;border:3px solid var(--line);box-shadow:0 0 0 2px var(--yel);transition:transform .12s}
.dx input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.dx input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:#ffffff26}
.dx input[type=range]::-moz-range-progress{height:6px;border-radius:4px;background:var(--yel)}
.dx input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--line);box-shadow:0 0 0 2px var(--yel)}
/* EV footer */
.dx .evt{padding:6px 12px 12px}
.dx .evh{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;color:#e8ebff}
.dx .evh b{color:var(--yel)}.dx .evnote{color:var(--mut);font-weight:500}
.dx .mt{display:block;height:7px;margin:5px 0 8px;border-radius:5px;background:#0007;border:2px solid var(--line);overflow:hidden}
.dx .mt b{display:block;height:100%;transform-origin:left;background:var(--yel);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.dx .pr{display:flex;gap:6px;flex-wrap:wrap}
/* centre stage */
.dx .mid{position:relative;display:grid;place-items:center;min-height:430px}
.dx .mid:before{content:"";position:absolute;inset:6% 2%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--c) 0,transparent 68%);opacity:.38;animation:aura 4s ease-in-out infinite}
.dx .mid:after{content:"";position:absolute;width:74%;aspect-ratio:1;border-radius:50%;pointer-events:none;border:3px dashed #ffffff2e;animation:spin2 40s linear infinite}
@keyframes aura{50%{opacity:.62;transform:scale(1.06)}}
@keyframes spin2{to{transform:rotate(360deg)}}
.dx .pic{position:relative;z-index:1;width:100%;min-height:430px;background:none;border:0}
.dx .pic:before{left:50%;bottom:11%;width:56%;height:34px;margin-left:-28%;border:0;background:radial-gradient(#000a,transparent 70%);animation:shad 3.2s 1.2s ease-in-out infinite;translate:none}
@keyframes shad{50%{transform:scale(.82);opacity:.6}}
.dx .pic img{width:min(95%,430px);max-height:390px}
#ov.show .dx .pic img{opacity:1;animation:dxImg .8s .25s both cubic-bezier(.2,1.3,.4,1),flt 3.2s 1.2s ease-in-out infinite}
@keyframes dxImg{from{transform:scale(.5) translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* right column */
.dx .ab{margin-top:6px}.dx .ab:first-child{margin-top:0}
.dx .ab p{font-size:.84rem;color:#cfd3ee}
.dx .facts{margin-bottom:8px}
.dx .dexent{margin:0}
/* bottom bar */
.dx .bot{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 20px 18px}
.dx .bar2{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 16px;padding:6px 18px;border-radius:14px;background:linear-gradient(#ffffff26,#ffffff0f);border:3px solid #ffffff30;box-shadow:0 0 0 2px var(--line)}
.dx .bar2 h3{margin:0;font-size:1.45rem}
.dx .bar2 .no,.dx .bar2 .gn,.dx .bar2 .wt{font-weight:600;color:#dfe2ff;font-size:.9rem}
.dx .tys{display:flex;gap:5px}
#ov.show .dx .tys .t{animation:chip .45s calc(.3s + var(--ci,0)*.1s) both cubic-bezier(.3,1.7,.5,1)}
.dx .nb{display:flex;align-items:center;gap:6px;background:none;border:0;box-shadow:none;color:#fff;font-size:2.2rem;line-height:1;padding:0 4px;transition:transform .15s}
.dx .nb img{height:58px;width:58px;object-fit:contain;filter:drop-shadow(0 4px 3px #0006);opacity:.85;transition:transform .2s,opacity .2s}
.dx .nb:hover img{transform:scale(1.15);opacity:1}
.dx #pv:hover{transform:translateX(-3px)}.dx #nx:hover{transform:translateX(3px)}
@media(prefers-reduced-motion:reduce){.dx .mid:before,.dx .mid:after,.dx .pic:before{animation:none}#ov.show .dx .sr .bw i{animation:none;transform:none}}
</style>
<style id="clarity">
/* sharper, higher-contrast sprites */
.top{height:200px;background:radial-gradient(circle at 50% 55%,#ffffff70 0 30%,transparent 31%),linear-gradient(160deg,var(--c1,#ccd),var(--c2,#eef))}
.top img{max-width:90%;max-height:92%;filter:contrast(1.08) saturate(1.12) drop-shadow(0 0 1px #000c) drop-shadow(0 7px 5px #0005)}
.pic img,.dx .pic img{filter:contrast(1.08) saturate(1.12) drop-shadow(0 0 1.5px #000c) drop-shadow(0 12px 8px #0006)}
.dx .pic img{width:min(98%,470px);max-height:420px}
.dx .nb img{filter:contrast(1.08) drop-shadow(0 0 1px #000c) drop-shadow(0 4px 3px #0006)}
img[src*="animated"]{image-rendering:pixelated}
.dx .lvs{color:var(--yel);font-size:.78rem;font-weight:600}
</style>
