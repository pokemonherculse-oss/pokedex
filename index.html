<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex by Generation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ee1515;--dred:#b30d0d;--yel:#ffcb05;--blue:#3b4cca;--ink:#222224;--bg:#f3f0e6;--card:#fff;--mut:#667;--line:#222224}
@media(prefers-color-scheme:dark){:root{--bg:#1c1d2b;--card:#2a2c40;--ink:#f4f4f8;--mut:#b4b8d0;--line:#0c0c14}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;background:var(--bg) radial-gradient(circle at 1px 1px,#0000000d 1.5px,transparent 0) 0 0/22px 22px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--red) 0 78%,var(--dred) 78%);border-bottom:5px solid var(--line);padding:10px 20px 14px;box-shadow:0 4px 0 #0003}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lens{width:46px;height:46px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#bfeaff,#2f9bff 45%,#0b4fb3);box-shadow:0 0 0 4px var(--line),inset 0 -4px 6px #0006;flex:none}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i:nth-child(1){background:#ff5a5a}.dots i:nth-child(2){background:var(--yel)}.dots i:nth-child(3){background:#4cd964}
h1{margin:0;font-size:1.7rem;font-weight:700;color:#fff;text-shadow:2px 2px 0 var(--line),-1px -1px 0 var(--line),1px -1px 0 var(--line),-1px 1px 0 var(--line);letter-spacing:.02em}
.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button,select,input{font:inherit;font-weight:500;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:99px;padding:3px 13px;box-shadow:0 3px 0 var(--line)}
@media(prefers-color-scheme:dark){button,select,input{color:#222}}
button{cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
button.on{background:var(--yel)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{min-width:170px}
main{padding:6px 20px 60px;max-width:1500px;margin:auto}
h2{display:inline-flex;align-items:center;gap:10px;margin:36px 0 0;font-size:1.3rem;font-weight:700;color:#fff;background:var(--blue);border:4px solid var(--line);border-radius:14px;padding:3px 18px 3px 12px;box-shadow:0 4px 0 var(--line)}
h2:before{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:linear-gradient(var(--red) 0 44%,var(--line) 44% 56%,#fff 56%)}
h2 small{color:var(--yel);font-weight:500;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;margin-top:16px}
.card{--tc:#999;background:var(--card);border:4px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 0 var(--line);transition:transform .15s}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
.top{height:185px;display:grid;place-items:center;position:relative;border-bottom:4px solid var(--line);background:radial-gradient(circle at 50% 55%,#fff9 0 30%,transparent 31%),linear-gradient(160deg,var(--c1,#ccd),var(--c2,#eef))}
.top:before{content:"";position:absolute;width:170px;height:170px;right:-40px;bottom:-50px;border-radius:50%;border:12px solid #ffffff55;background:linear-gradient(#fff3 0 44%,#fff5 44% 56%,#fff3 56%)}
.top img{position:relative;max-width:80%;max-height:82%;filter:drop-shadow(0 7px 5px #0004)}
.dex{position:absolute;left:10px;top:9px;font-weight:700;font-size:.8rem;color:#fff;background:var(--line);padding:1px 9px;border-radius:99px;z-index:1}
.body{padding:10px 13px 13px}
.name{font-weight:700;font-size:1.15rem}
.types{display:flex;gap:5px;margin:4px 0 9px;min-height:24px}
.t{font-size:.76rem;font-weight:600;padding:1px 11px;border-radius:99px;color:#fff;text-transform:capitalize;border:2px solid #0005;text-shadow:0 1px 1px #0006}
.s{display:grid;grid-template-columns:32px 1fr 28px;gap:6px;align-items:center;font-size:.78rem;color:var(--mut);margin:3px 0;font-weight:500}
.s i{display:block;height:9px;border-radius:5px;background:#0002;border:2px solid var(--line);overflow:hidden}
.s i b{display:block;height:100%;background-image:linear-gradient(#fff5,#0002)}
.s span:last-child{text-align:right;color:var(--ink);font-weight:700}
.tot{margin-top:7px;padding:3px 10px;border-radius:99px;background:var(--yel);color:#222;border:2px solid var(--line);font-size:.82rem;display:flex;justify-content:space-between;font-weight:700}
.note{color:var(--mut);font-size:.72rem;margin-top:4px}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style></head>
<body>
<header>
<div class="logo"><span class="lens"></span><div class="dots"><i></i><i></i><i></i></div><h1>Pokédex by Generation</h1></div>
<div class="bar" id="bar"></div>
</header>
<main id="main"></main>
<script>
// dex number + name (as listed). "Mega ..." entries are Mega forms; repeated plain names are regional forms.
const RAW=`3 Venusaur;3 Mega Venusaur;6 Charizard;6 Mega Charizard X;6 Mega Charizard Y;9 Blastoise;9 Mega Blastoise;15 Beedrill;15 Mega Beedrill;18 Pidgeot;18 Mega Pidgeot;24 Arbok;25 Pikachu;26 Raichu;26 Mega Raichu X;26 Mega Raichu Y;26 Raichu;36 Clefable;36 Mega Clefable;38 Ninetales;38 Ninetales;40 Wigglytuff;45 Vileplume;53 Persian;53 Persian;59 Arcanine;59 Arcanine;65 Alakazam;65 Mega Alakazam;68 Machamp;71 Victreebel;71 Mega Victreebel;80 Slowbro;80 Mega Slowbro;80 Slowbro;83 Farfetch'd;94 Gengar;94 Mega Gengar;115 Kangaskhan;115 Mega Kangaskhan;121 Starmie;121 Mega Starmie;122 Mr. Mime;127 Pinsir;127 Mega Pinsir;128 Tauros;128 Tauros;130 Gyarados;130 Mega Gyarados;132 Ditto;134 Vaporeon;135 Jolteon;136 Flareon;142 Aerodactyl;142 Mega Aerodactyl;143 Snorlax;149 Dragonite;149 Mega Dragonite;154 Meganium;154 Mega Meganium;157 Typhlosion;157 Typhlosion;160 Feraligatr;160 Mega Feraligatr;168 Ariados;181 Ampharos;181 Mega Ampharos;184 Azumarill;186 Politoed;196 Espeon;197 Umbreon;199 Slowking;199 Slowking;205 Forretress;208 Steelix;208 Mega Steelix;211 Qwilfish;212 Scizor;212 Mega Scizor;214 Heracross;214 Mega Heracross;227 Skarmory;227 Mega Skarmory;229 Houndoom;229 Mega Houndoom;248 Tyranitar;248 Mega Tyranitar;254 Sceptile;254 Mega Sceptile;257 Blaziken;257 Mega Blaziken;260 Swampert;260 Mega Swampert;279 Pelipper;282 Gardevoir;282 Mega Gardevoir;302 Sableye;302 Mega Sableye;303 Mawile;303 Mega Mawile;306 Aggron;306 Mega Aggron;308 Medicham;308 Mega Medicham;310 Manectric;310 Mega Manectric;317 Swalot;319 Sharpedo;319 Mega Sharpedo;323 Camerupt;323 Mega Camerupt;324 Torkoal;334 Altaria;334 Mega Altaria;350 Milotic;351 Castform;354 Banette;354 Mega Banette;358 Chimecho;358 Mega Chimecho;359 Absol;359 Mega Absol;359 Mega Absol Z;362 Glalie;362 Mega Glalie;373 Salamence;373 Mega Salamence;376 Metagross;376 Mega Metagross;389 Torterra;392 Infernape;395 Empoleon;398 Staraptor;398 Mega Staraptor;405 Luxray;407 Roserade;409 Rampardos;411 Bastiodon;428 Lopunny;428 Mega Lopunny;442 Spiritomb;445 Garchomp;445 Mega Garchomp;445 Mega Garchomp Z;448 Lucario;448 Mega Lucario;448 Mega Lucario Z;450 Hippowdon;454 Toxicroak;460 Abomasnow;460 Mega Abomasnow;461 Weavile;464 Rhyperior;470 Leafeon;471 Glaceon;472 Gliscor;473 Mamoswine;475 Gallade;475 Mega Gallade;478 Froslass;478 Mega Froslass;479 Rotom;497 Serperior;500 Emboar;500 Mega Emboar;503 Samurott;503 Samurott;505 Watchog;510 Liepard;512 Simisage;514 Simisear;516 Simipour;518 Musharna;530 Excadrill;530 Mega Excadrill;531 Audino;531 Mega Audino;534 Conkeldurr;545 Scolipede;545 Mega Scolipede;547 Whimsicott;553 Krookodile;560 Scrafty;560 Mega Scrafty;563 Cofagrigus;569 Garbodor;571 Zoroark;571 Zoroark;579 Reuniclus;584 Vanilluxe;587 Emolga;604 Eelektross;604 Mega Eelektross;609 Chandelure;609 Mega Chandelure;614 Beartic;618 Stunfisk;618 Stunfisk;623 Golurk;623 Mega Golurk;635 Hydreigon;637 Volcarona;652 Chesnaught;652 Mega Chesnaught;655 Delphox;655 Mega Delphox;658 Greninja;658 Mega Greninja;660 Diggersby;663 Talonflame;666 Vivillon;668 Pyroar;668 Mega Pyroar;670 Floette;670 Mega Floette;671 Florges;673 Gogoat;675 Pangoro;676 Furfrou;678 Meowstic;678 Mega Meowstic;681 Aegislash;683 Aromatisse;685 Slurpuff;687 Malamar;687 Mega Malamar;689 Barbaracle;689 Mega Barbaracle;691 Dragalge;691 Mega Dragalge;693 Clawitzer;695 Heliolisk;697 Tyrantrum;699 Aurorus;700 Sylveon;701 Hawlucha;701 Mega Hawlucha;702 Dedenne;706 Goodra;706 Goodra;707 Klefki;709 Trevenant;711 Gourgeist;713 Avalugg;713 Avalugg;715 Noivern;724 Decidueye;724 Decidueye;727 Incineroar;730 Primarina;733 Toucannon;740 Crabominable;740 Mega Crabominable;745 Lycanroc;748 Toxapex;750 Mudsdale;752 Araquanid;758 Salazzle;763 Tsareena;765 Oranguru;766 Passimian;768 Golisopod;768 Mega Golisopod;778 Mimikyu;780 Drampa;780 Mega Drampa;784 Kommo-o;812 Rillaboom;815 Cinderace;818 Inteleon;823 Corviknight;828 Thievul;841 Flapple;842 Appletun;844 Sandaconda;849 Toxtricity;853 Grapploct;855 Polteageist;858 Hatterene;861 Grimmsnarl;863 Perrserker;865 Sirfetch'd;866 Mr. Rime;867 Runerigus;869 Alcremie;870 Falinks;870 Mega Falinks;871 Pincurchin;876 Indeedee;877 Morpeko;887 Dragapult;899 Wyrdeer;900 Kleavor;902 Basculegion;903 Sneasler;904 Overqwil;908 Meowscarada;911 Skeledirge;914 Quaquaval;923 Pawmot;925 Maushold;930 Arboliva;931 Squawkabilly;934 Garganacl;936 Armarouge;937 Ceruledge;939 Bellibolt;943 Mabosstiff;952 Scovillain;952 Mega Scovillain;956 Espathra;959 Tinkaton;964 Palafin;968 Orthworm;970 Glimmora;970 Mega Glimmora;972 Houndstone;979 Annihilape;981 Farigiraf;983 Kingambit;998 Baxcalibur;998 Mega Baxcalibur;1000 Gholdengo;1013 Sinistcha;1018 Archaludon;1019 Hydrapple`;
const REG={26:'alola',38:'alola',53:'alola',59:'hisui',80:'galar',199:'galar',128:'paldea',157:'hisui',503:'hisui',571:'hisui',618:'galar',706:'hisui',713:'hisui',724:'hisui'};
const RN={alola:'Alolan',hisui:'Hisuian',galar:'Galarian',paldea:'Paldean'};
const GENS=[[1,151,'Kanto'],[152,251,'Johto'],[252,386,'Hoenn'],[387,493,'Sinnoh'],[494,649,'Unova'],[650,721,'Kalos'],[722,809,'Alola'],[810,905,'Galar / Hisui'],[906,1025,'Paldea']];
const TC={normal:'#8a8a78',fire:'#e8622c',water:'#4a86e8',electric:'#d9a800',grass:'#4aa04a',ice:'#52b5b5',fighting:'#b03a30',poison:'#9040a0',ground:'#b89545',flying:'#7f8fe0',psychic:'#e8457a',bug:'#8ca010',rock:'#a08a30',ghost:'#6a4f94',dragon:'#5a30e0',dark:'#5a4a3e',steel:'#7e8aa0',fairy:'#e07ab0'};
const STATS=[['hp','HP'],['attack','Atk'],['defense','Def'],['special-attack','SpA'],['special-defense','SpD'],['speed','Spe']];
const API='https://pokeapi.co/api/v2/';
const seen={};
const list=RAW.split(';').map(s=>{
  const m=s.match(/^(\d+) (.+)$/);const dex=+m[1];let name=m[2];
  const mega=name.startsWith('Mega ');let key=null,label=name,sfx='';
  if(mega){const p=name.slice(5).split(' ');const l=p[p.length-1];if(['X','Y','Z'].includes(l)){sfx=l.toLowerCase();}}
  else{const k=dex+name;if(seen[k]){key=REG[dex];label=(RN[key]||'Regional')+' '+name;}seen[k]=1;}
  return{dex,name,label,mega,sfx,reg:key,gen:GENS.findIndex(g=>dex>=g[0]&&dex<=g[1])};
});
let mode=localStorage.getItem('sp')||'home',gensel=-1,q='',megaOnly=false;
const $=id=>document.getElementById(id);
const cache={};
async function j(u){if(cache[u])return cache[u];const r=await fetch(u);if(!r.ok)throw 0;return cache[u]=r.json()}
async function load(e){
  try{
    const sp=await j(API+'pokemon-species/'+e.dex);
    let v=sp.varieties.map(x=>x.pokemon.name),pick;
    const def=sp.varieties.find(x=>x.is_default).pokemon.name;
    if(e.mega){pick=v.find(n=>n.includes('mega')&&(!e.sfx||n.endsWith('-'+e.sfx)))||v.find(n=>n.includes('mega'));}
    else if(e.reg){pick=v.find(n=>n.includes(e.reg));}
    else pick=def;
    if(!pick){e.miss=true;pick=def;}
    e.data=await j(API+'pokemon/'+pick);
  }catch(x){e.err=true}
}
function sprite(e){
  const s=e.data.sprites,o=s.other;
  const a=o['official-artwork'].front_default;
  const h=o.home.front_default;
  const bw=s.versions['generation-v']['black-white'].animated.front_default;
  const sd=o.showdown.front_default;
  const map={home:h||a,art:a||h,anim:bw||sd||h||a,showdown:sd||h||a};
  return map[mode]||a||s.front_default;
}
function paint(e,el){
  if(e.err||!e.data){el.querySelector('.note').textContent='Could not load data (check internet).';return}
  const d=e.data,ty=d.types.map(t=>t.type.name),c1=TC[ty[0]],c2=TC[ty[1]||ty[0]];
  const top=el.querySelector('.top');top.style.setProperty('--c1',c1+'99');top.style.setProperty('--c2',c2+'44');
  top.querySelector('img').src=sprite(e)||'';
  el.querySelector('.types').innerHTML=ty.map(t=>`<span class="t" style="background:${TC[t]}">${t}</span>`).join('');
  let tot=0,h='';
  STATS.forEach(([k,l])=>{const v=d.stats.find(s=>s.stat.name===k).base_stat;tot+=v;h+=`<div class="s"><span>${l}</span><i><b style="width:${Math.min(100,v/180*100)}%;background:${c1}"></b></i><span>${v}</span></div>`});
  el.querySelector('.st').innerHTML=h+`<div class="tot"><span>Total</span><span>${tot}</span></div>`;
  if(e.miss)el.querySelector('.note').textContent='Mega data not in PokéAPI yet — showing base form.';
}
const io=new IntersectionObserver(es=>es.forEach(async x=>{
  if(!x.isIntersecting)return;io.unobserve(x.target);
  const e=x.target._e;if(!e.data&&!e.err)await load(e);paint(e,x.target);
}),{rootMargin:'400px'});
function card(e){
  const d=document.createElement('article');d.className='card';d._e=e;
  d.innerHTML=`<div class="top"><span class="dex">#${String(e.dex).padStart(4,'0')}</span><img alt="${e.label}" loading="lazy"></div><div class="body"><div class="name">${e.label}</div><div class="types"></div><div class="st"></div><div class="note"></div></div>`;
  io.observe(d);return d;
}
function render(){
  const m=$('main');m.innerHTML='';
  GENS.forEach((g,i)=>{
    if(gensel>=0&&gensel!==i)return;
    const items=list.filter(e=>e.gen===i&&(!megaOnly||e.mega)&&(!q||(e.label+' '+e.dex).toLowerCase().includes(q)));
    if(!items.length)return;
    const h=document.createElement('h2');h.innerHTML=`Generation ${i+1}<small>${g[2]} · ${items.length} entries</small>`;
    const gr=document.createElement('div');gr.className='grid';items.forEach(e=>gr.append(card(e)));
    m.append(h,gr);
  });
  if(!m.children.length)m.innerHTML='<p>No matches. Try a different name or generation.</p>';
}
function bar(){
  const b=$('bar');b.innerHTML='';
  const mk=(t,on,f)=>{const x=document.createElement('button');x.textContent=t;if(on)x.className='on';x.onclick=f;b.append(x)};
  mk('All',gensel<0,()=>{gensel=-1;bar();render()});
  GENS.forEach((g,i)=>mk('Gen '+(i+1),gensel===i,()=>{gensel=i;bar();render()}));
  mk(megaOnly?'Megas only ✓':'Megas only',megaOnly,()=>{megaOnly=!megaOnly;bar();render()});
  const s=document.createElement('select');s.setAttribute('aria-label','Sprite style');
  [['home','3D (Pokémon HOME)'],['art','Official artwork'],['anim','Animated (Gen 5)'],['showdown','Showdown 3D-style']].forEach(([v,t])=>{const o=new Option(t,v);if(v===mode)o.selected=true;s.add(o)});
  s.onchange=()=>{mode=s.value;localStorage.setItem('sp',mode);document.querySelectorAll('.card').forEach(c=>{if(c._e.data)c.querySelector('img').src=sprite(c._e)||''})};
  b.append(s);
  const i=document.createElement('input');i.type='search';i.placeholder='Search name or #';i.value=q;
  i.oninput=()=>{q=i.value.toLowerCase().trim();render();i.focus()};b.append(i);
}
bar();render();
</script>
</body></html>
